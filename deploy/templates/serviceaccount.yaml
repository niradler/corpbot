{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "corpbot.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "corpbot.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The projected boxy token is mounted explicitly as a volume; the default SA token mount also
# establishes the SA identity. Keep automount as configured.
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
