{{- if .Values.secrets.create -}}
{{- if .Values.secrets.existingSecret -}}
{{- fail "secrets.create and secrets.existingSecret are mutually exclusive — set only one." -}}
{{- end -}}
{{/*
DEV CONVENIENCE ONLY. Renders a Secret from the placeholder values in values.yaml. For
production, set secrets.create=false and use secrets.existingSecret with a secret you manage
out-of-band (SOPS, sealed-secrets, External Secrets, cloud secret manager). NEVER commit real
secret values into values.yaml.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-secrets" (include "corpbot.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "corpbot.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secrets.keys.slackBotToken }}: {{ .Values.secrets.values.SLACK_BOT_TOKEN | quote }}
  {{ .Values.secrets.keys.slackAppToken }}: {{ .Values.secrets.values.SLACK_APP_TOKEN | quote }}
  {{ .Values.secrets.keys.llmApiKey }}: {{ .Values.secrets.values.ANTHROPIC_API_KEY | quote }}
  {{- if eq .Values.nanobot.boxyClient.auth "static" }}
  {{ .Values.secrets.keys.boxyRouterToken }}: {{ .Values.secrets.values.BOXY_ROUTER_TOKEN | quote }}
  {{- end }}
{{- end }}
