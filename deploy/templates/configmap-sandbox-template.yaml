apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "corpbot.fullname" . }}-sandbox-template
  namespace: {{ include "corpbot.boxyNamespace" . }}
  labels:
    {{- include "corpbot.labels" . | nindent 4 }}
data:
  # Per-user boxy sandbox template (the shape boxy lazily provisions on the first unknown
  # X-Sandbox-Id). v1: ephemeral /workspace, NO S3 (deferred); no internet; 1h sliding TTL.
  #
  # TODO(boxy): boxy 0.1.1's published chart does NOT expose a `sandboxTemplate.fromConfigMap`
  # value — the router builds the per-user sandbox spec from the inbound MCP request and chart
  # defaults (router.defaultSandbox is OFF for safety). This ConfigMap therefore documents the
  # intended per-user template and is a no-op until boxy supports sourcing a template from a
  # ConfigMap. When that lands, point the boxy router at this ConfigMap. The values here mirror
  # docs/architecture.md.
  template.json: |
    {
      "ttlSeconds": 3600,
      "network": { "allowInternetAccess": false },
      "allowedBinaries": ["bash", "python3", "node", "git"],
      "vm": {
        "memoryMb": 512,
        "vcpus": 1,
        "workdir": "/workspace",
        "shell": "/bin/bash"
      }
    }
