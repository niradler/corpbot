apiVersion: v2
name: corpbot
description: >-
  Umbrella chart for the corpbot platform: nanobot (agent brain + Slack ingress) with the
  corpbot plugin, plus boxy (per-user nsjail sandbox runtime) as a subchart. One `helm install`
  brings up the whole platform with security best practices (non-root, NetworkPolicy,
  default-sandbox-off, ServiceAccount-token auth + RBAC).
type: application

# Chart version — bump on chart changes. appVersion tracks the corpbot plugin release.
version: 0.2.4
appVersion: "0.1.2"

dependencies:
  # boxy is an EXTERNAL dependency consumed from its published chart — never forked or vendored.
  # 0.1.3 carries per-user session provisioning (two-header X-Session-Id + X-Sandbox-Id), the
  # subchart-safe mTLS secret names, and CRDs-in-crds/ (niradler/boxy PR #6, now published).
  # 0.1.1 lacked the provisioning path and per-user routing failed.
  # Gate with boxy.enabled so corpbot's own templates render/install standalone.
  - name: boxy
    version: "0.1.3"
    repository: "oci://ghcr.io/niradler/charts"
    alias: boxy
    condition: boxy.enabled
