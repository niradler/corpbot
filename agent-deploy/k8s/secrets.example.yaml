# SCAFFOLD ONLY — DO NOT COMMIT REAL SECRETS.
# Use a real secret manager (SOPS, sealed-secrets, External Secrets, or IRSA for S3).
# This file documents the required keys. Replace REPLACE_ME and apply out-of-band.
apiVersion: v1
kind: Secret
metadata:
  name: corpbot-secrets
  namespace: nanobot
type: Opaque
stringData:
  # nanobot → boxy auth (must match boxy-router's configured token)
  BOXY_ROUTER_TOKEN: "REPLACE_ME"
  # Slack app bot token
  SLACK_BOT_TOKEN: "REPLACE_ME"
  # LLM provider key (rename to your provider's env var)
  ANTHROPIC_API_KEY: "REPLACE_ME"
---
# S3: PREFER IRSA / instance role on the boxy controller's ServiceAccount over static keys.
# Only use this if IRSA is not available.
apiVersion: v1
kind: Secret
metadata:
  name: corpbot-s3
  namespace: boxy
type: Opaque
stringData:
  S3_BUCKET: "REPLACE_ME"
  # AWS_ACCESS_KEY_ID: "REPLACE_ME"      # avoid if using IRSA
  # AWS_SECRET_ACCESS_KEY: "REPLACE_ME"  # avoid if using IRSA
