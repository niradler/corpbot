# Per-user sandbox template (boxy per-user routing, PR niradler/boxy#5). boxy lazily provisions
# a sandbox from this on the first unknown X-Sandbox-Id. SCAFFOLD.
#
# DEFERRED (v1): S3 /workspace persistence is a later milestone, so this v1 template has NO
# setupScript/teardownScript/scriptEnv (S3) keys — sandboxes run with an ephemeral, per-sandbox
# /workspace. When the S3 milestone lands, re-add those keys pointing at the derived controller
# image's /opt/boxy/scripts/s3-restore.sh and s3-sync.sh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: corpbot-sandbox-template
  namespace: boxy
  labels:
    app.kubernetes.io/part-of: corpbot
data:
  template.json: |
    {
      "ttlSeconds": 3600,
      "network": { "enabled": true, "allowInternetAccess": false },
      "allowedBinaries": ["bash", "python3", "node", "git"],
      "vm": {
        "memoryMb": 512,
        "rlimits": [
          { "resource": "nproc",  "soft": 256 },
          { "resource": "nofile", "soft": 1024 }
        ]
      }
    }
