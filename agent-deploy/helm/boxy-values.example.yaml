# Values for the pinned boxy chart: oci://ghcr.io/niradler/charts/boxy
# SCAFFOLD — confirm key names against the chart's values.yaml for the pinned version.
# Install with:  helm install boxy oci://ghcr.io/niradler/charts/boxy \
#                  --version <PINNED_CHART_VERSION> -n boxy -f boxy-values.example.yaml

# --- image pinning -----------------------------------------------------------
# Pin the controller image that pre-bakes AWS CLI + allowedBinaries (Dockerfile.controller.dev).
image:
  controller:
    repository: ghcr.io/niradler/boxy-controller   # TODO confirm
    tag: "<PINNED_CONTROLLER_TAG>"
  router:
    repository: ghcr.io/niradler/boxy-router        # TODO confirm
    tag: "<PINNED_ROUTER_TAG>"
  operator:
    repository: ghcr.io/niradler/boxy-operator      # TODO confirm
    tag: "<PINNED_OPERATOR_TAG>"

# --- router ------------------------------------------------------------------
router:
  # Static bearer token nanobot sends as Authorization. Must match BOXY_ROUTER_TOKEN secret.
  auth:
    token:
      secretName: corpbot-secrets   # TODO
      secretKey: BOXY_ROUTER_TOKEN  # TODO
  maxOutputBytes: 6291456           # 6 MB exec output cap

# --- SECURITY: disable the default sandbox (fail closed) ----------------------
# boxy does NOT validate the MCP X-Sandbox-Id header and, if a tool call arrives WITHOUT an
# id while a default sandbox is enabled, it silently routes to that SHARED default sandbox —
# a cross-user data risk. nanobot already refuses to call boxy without an id (fail closed),
# but disable boxy's default sandbox too for defense in depth: a missing id then returns a
# tool-error instead of touching a shared sandbox.
defaultSandbox:
  enabled: false   # TODO confirm exact chart key (maps to DefaultSandboxEnabled / DefaultSandboxConfig)

# --- controller / S3 ---------------------------------------------------------
controller:
  serviceAccount:
    # Prefer IRSA: annotate the SA with the IAM role that grants s3:GetObject/PutObject.
    create: true
    annotations:
      eks.amazonaws.com/role-arn: "<IRSA_ROLE_ARN>"   # TODO
  scripts:
    # Mounted at /opt/boxy/scripts (referenced by the sandbox template setup/teardown).
    # Baked into the controller image per boxy/README.md task C.
    path: /opt/boxy/scripts

# --- sandbox template default ------------------------------------------------
# The authoritative template is the ConfigMap in k8s/sandbox-template.configmap.yaml.
# If the chart wants an inline default instead, mirror it here. Keep ONE source of truth.
sandboxTemplate:
  fromConfigMap: corpbot-sandbox-template   # TODO confirm the chart supports this
