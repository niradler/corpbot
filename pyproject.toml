[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corpbot"
version = "0.1.1"
description = "Thin nanobot plugin: routes boxy MCP tool calls to a per-user sandbox via X-Session-Id (user) + X-Sandbox-Id (shared config)."
requires-python = ">=3.11"
dependencies = ["nanobot-ai", "httpx", "mcp"]

[project.entry-points."nanobot.tools"]
boxy_bash = "corpbot.tools:BashTool"
boxy_read_file = "corpbot.tools:ReadFileTool"
boxy_write_file = "corpbot.tools:WriteFileTool"
boxy_edit_file = "corpbot.tools:EditFileTool"

[tool.setuptools.packages.find]
where = ["src"]
